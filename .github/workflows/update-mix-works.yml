# Mix Works（新着 / 再生数順）を毎日自動更新するワークフロー
# - YouTube プレイリストから最新データを取得し assets/data/mix-works.js と docs/assets/data/mix-works.js を更新
# - リポジトリの Secrets に YT_API_KEY（YouTube Data API v3 のキー）を登録すると、より正確・安定して取得できます（任意）
name: Update Mix Works

on:
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch playlist data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/update-mix-works.mjs

      - name: Commit if changed
        run: |
          # updatedAt だけの変化ではコミットしない
          if git diff --quiet -I '"updatedAt"' -- assets/data docs/assets/data; then
            echo "No changes"
            git checkout -- assets/data docs/assets/data
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data docs/assets/data
          git commit -m "chore: update mix works data"
          git push
